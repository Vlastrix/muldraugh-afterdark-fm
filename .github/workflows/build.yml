name: Build Windows Connector and Workshop package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install developer dependencies
        run: python -m pip install -r requirements-build.txt lupa
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test the standalone app
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: afterdark-windows-and-workshop
          path: dist/0.7.6-dev/
